# kitty.conf for the Windows port
#
# Copy this file and the kitty-themes folder next to it into
# %USERPROFILE%\.config\kitty so the tree looks like this:
#
#   C:\Users\<you>\.config\kitty\kitty.conf
#   C:\Users\<you>\.config\kitty\kitty-themes\DimmedMonokai.conf
#
# Everything here is a normal kitty option. The comments cover the settings
# where Windows behaves differently from Linux or macOS, so you know which ones
# you can change freely and which ones are load bearing.


# Colours
# The path is relative to this file, so the theme travels with the config.
include ./kitty-themes/DimmedMonokai.conf


# Shell
#
# Pick one. pwsh and cmd run on a pseudoconsole, which is how a Windows terminal
# normally talks to a shell. An MSYS2 or Cygwin shell instead runs on a real
# Cygwin pty through kitty's bridge, which keeps conhost out of the data path
# and stops the cursor flickering while the line editor redraws.
#
# shell pwsh.exe -NoLogo
# shell cmd.exe
shell C:/msys64/usr/bin/zsh.exe --login -i

# The three variables below only matter for the MSYS2 shell above.
# MSYSTEM picks the MinGW64 environment, so native tools such as rg sit on PATH
# beside the MSYS2 ones.
env MSYSTEM=MINGW64
# Without this, a login shell moves to your home folder and the folder you
# opened kitty in is lost.
env CHERE_INVOKING=1
# Folds the full Windows PATH into the shell rather than replacing it, so
# anything installed outside MSYS2 stays reachable.
env MSYS2_PATH_TYPE=inherit
#
# One known limitation of zsh on MSYS2: typing or pasting an emoji at the prompt
# shows the pieces of it instead, as <d83d> or similar. Cygwin stores a wide
# character in 16 bits, so anything above U+FFFF needs two of them, and zsh's
# line editor assumes one. It is only the prompt. Emoji in program output, file
# names and kitten interfaces are all fine, and bash on the same install handles
# them correctly.


# Font
# Any font installed on the system works. A Nerd Font is worth having if your
# prompt draws glyphs, which most do.
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0


# Background
#
# background_blur turns on the acrylic material, the same one Windows Terminal
# uses. It is built here rather than asked of DWM, so it survives losing focus
# and does not go flat when another window comes forward.
#
# The two options work together. background_opacity sets how much of the desktop
# comes through, and the acrylic is drawn to match, so changing one without the
# other will not look right. Values near 1.0 leave nothing for the blur to do.
background_opacity         0.8
background_blur            1

# Lets ctrl+shift+a then m and friends change the opacity at runtime.
dynamic_background_opacity 1

confirm_os_window_close    0


# Cursor
cursor_shape block
cursor_text_color #ffffff

# Draws a short trail behind the cursor as it moves. If you see what looks like
# two cursors while holding backspace across a wrapped line, this is why. Set it
# to 0 to turn it off.
cursor_trail 1

# Stops the shell integration replacing kitty's block cursor with a beam at the
# prompt. Drop this if you would rather the shell decide.
shell_integration no-cursor


# Scrolling
scrollback_lines 2000
wheel_scroll_min_lines 1


# Window
window_padding_width 1 10 10 10
placement_strategy top-left

# kitty's own default opens a fairly small window.
initial_window_width  60c
initial_window_height 16c

# Keeps the text readable under a selection instead of forcing theme colours.
selection_foreground  none
selection_background  none
